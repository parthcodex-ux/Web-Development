<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
</head>
<style>
    .container{
        width: 500px;
        height: 400px;
        background-color: lightblue;
        display:flex;
        justify-content:space-between;
        align-items:center;
        border-radius: 20px;
        text-align:justify;
        padding: 10px;
    }
    .container div{
        background-color: rgb(61, 68, 13);
        border-radius: 20px;
        padding: 20px;
        font-size: 30px;
        height: 100px;
        width: 80px;
        
    }
</style>
<body>
 <div class="container">
    <div>A</div>
      <div>B</div>
        <div>C</div>
 </div>
</body>
</html>
