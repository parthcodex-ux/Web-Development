<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: grey;
            padding: 15px 30px;
            color: Black;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            font-size: 18px;
            color: Black;
        }
        .card{
            margin: 10px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            width: 300px;
            align-items: center;
            padding: 10px;
            border-radius: 15px;
            background-color: lightblue;
            justify-content: center;
            margin-left: 600px;
            box-shadow: 7px 6px 10px rgb(21, 71, 107);
        }
    </style>
</head>

<body>
    <div class="nav_bar">
        <nav>
            <h2>Parth</h2>
            <ul>
                <li><a href="#">Link1</a></li>
                <li><a href="#">Link2</a></li>
                <li><a href="#">Link3</a></li>
            </ul>
        </nav>
    </div>
    <div class="card">
        <h3>Box</h3>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempora odio quo minima quidem sint illo eaque sit
            nisi nemo quasi aut architecto, quam doloremque corrupti mollitia nam dolorum. Pariatur, accusamus porro
           
        </p>
    </div>

</body>

</html>
