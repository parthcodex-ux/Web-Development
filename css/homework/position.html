<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        *{
                position:fixed;
        }
      .divs{
            position:relative;
border:4px solid black;
 margin: 0;  
padding:0;
width:100vw;
height:100vh;


        }
        #name{
position:absolute;
left:5px;
top:10px;
font-size: 25px;
color:red;
        }
          #name0{
position:absolute;
right:15px;
top:10px;
font-size: 25px;
color:red;
        }
          #name1{
position:absolute;
left:5px;
bottom:10px;
font-size: 25px;
color:red;
        }
          #name2{
position:absolute;
right:15px;
bottom:10px;
font-size: 25px;
color:red;
        }
        #name3{
position:absolute;
top:50%;
left:50%;
  transform: translate(-50%, -50%);
color:red;
font-size: 25px;
        }
              #name5{
position:absolute;
right:50%;
bottom:10px;
font-size: 25px;
color:red;
        }
              #name6{
position:absolute;
right:50%;
top:0;
font-size: 25px;
color:red;
        }
            #name7{
position:absolute;
right:15px;
top:50%;
font-size: 25px;
color:red;
        }
            #name8{
position:absolute;
left:0;
bottom:50%;
font-size: 25px;
color:red;
        }
img{
        height:100vh;
        width: 100vw;
}
        
    </style>
</head>
<body>
    <div class="divs">
    <img class ="img" src="/css/homework/photo.jpeg" alt="My Pic" width="500" height="1000">
    <div id="name">Parth </div>
       <div id="name0">Parth </div>
          <div id="name1">Parth </div>
             <div id="name2">Parth</div>
               <div id="name3">Parth </div>
               <div id="name5">Parth </div>
               <div id="name6">Parth </div>
                <div id="name7">Parth</div>
               <div id="name8">Parth </div>
     </div>
   
</body>
</html>
