<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Practice</title>
</head>
<body>
       <forms>
    <h2 Align="center">Student Registration</h2>
    <hr height="2000px"> <br> <br>
        <fieldset >
            <legend>Personal Information</legend>
        <label for="first name"> First Name:</label>
        <input type="text" name="first name" id="first name" placeholder="First name"  value="chotu "><br> <br>
        <label for="last name">Last Name:</label>
        <input type="text" name="last name" placeholder="Last name" id="last name" value="badmosh👻"><br>
        <br>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" value="badmosh@gmail.com" placeholder="abc@gmail.com"><br> <br>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password" > <br> <br>
        <label for="Dob">Date of birth: </label>
        <input type="date" id="Dob" name="Dob"><br> <br>
        <p>Select your gender:</p> 
        <input type="radio" id="male" name="gender" value="male" >
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" >
        <label for="female">Female</label>
        <input type="radio" id="others" name="gender" value="others" >
        <label for="others">Others</label><br> <br>
        <label for="no">Phone Number:</label>
        <input type="number" id="no" name="phone" value="79874xxxxx">
        <p>Select Course</p>
        <input type="select" >

 </fieldset>

    </forms>
</body>
</html>
